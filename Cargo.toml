[package]
edition = '2021'
name = "rip2"
version = "0.10.0"
authors = ["mail@nivekuil.com", "mahid@standingpad.org", "miles.cranmer@gmail.com"]
description = "rip: a safe and ergonomic alternative to rm"
repository = "https://github.com/MilesCranmer/rip2"
readme = "README.md"
license = "GPL-3.0+"
include = [
    "src/*.rs",
    "Cargo.toml",
]
keywords = ["cli", "rm", "delete", "trash", "recycle"]
categories = ["command-line-utilities"]
autobins = false

[dependencies]
anstyle = "1.0.6"
chrono = "0.4.33"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap_complete_nushell = "4.5"
dunce = "1.0.4"
fs4 = { version = "0.12.0", features = ["sync"] }
fs_extra = "1.3"
walkdir = "2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["fs"] }

[dev-dependencies]
assert_cmd = "2"
lazy_static = "1.4"
predicates = "3.0"
rand = "0.8"
regex = "1.11.0"
rstest = "0.24"
tempfile = "3"

[profile.release]
opt-level = 3

[[test]]
name = "unit_tests"
path = "tests/unit_tests.rs"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[[bin]]
name = "rip"
path = "src/main.rs"

[package.metadata.binstall]
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
[package.metadata.binstall.overrides.x86_64-unknown-freebsd]
pkg-url = "{ repo }/releases/download/v{ version }/rip-FreeBSD-x86_64.tar.gz"
[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/rip-Linux-x86_64-musl.tar.gz"
[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/rip-Linux-aarch64-musl.tar.gz"
[package.metadata.binstall.overrides.arm-unknown-linux-musleabi]
pkg-url = "{ repo }/releases/download/v{ version }/rip-Linux-arm-musl.tar.gz"
[package.metadata.binstall.overrides.i686-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/rip-Linux-i686-musl.tar.gz"
[package.metadata.binstall.overrides.powerpc-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/rip-Linux-powerpc-gnu.tar.gz"
[package.metadata.binstall.overrides.powerpc64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/rip-Linux-powerpc64-gnu.tar.gz"
[package.metadata.binstall.overrides.powerpc64le-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/rip-Linux-powerpc64le.tar.gz"
[package.metadata.binstall.overrides.s390x-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/rip-Linux-s390x-gnu.tar.gz"
[package.metadata.binstall.overrides.i686-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/rip-Windows-i686.zip"
pkg-fmt = "zip"
[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/rip-Windows-x86_64.zip"
pkg-fmt = "zip"
[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/rip-macOS-Darwin-x86_64.tar.gz"
[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/rip-macOS-Darwin-aarch64.tar.gz"
